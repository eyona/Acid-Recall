name: TB note menu test download
on:
  push:
    branches: [codex/tb-note-menu]
permissions:
  contents: read
concurrency:
  group: tb-note-menu-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Prepare ASIO SDK and LLVM
        shell: pwsh
        run: . ./scripts/setup-asio.ps1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
      - name: Check UI and actual TB note selection
        run: |
          cargo test --locked -p orb-ui --lib --test wired --test menu
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo clippy --locked -p orb-ui --all-targets -- -D warnings
      - name: Build corrected portable application
        run: cargo build --release --locked -p orb-ui
      - name: Prepare separate test ZIP
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download windows-preview --repo $env:GITHUB_REPOSITORY --pattern ACID-RECALL-Windows-x64.zip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $approvedHash = (Get-FileHash -Algorithm SHA256 ACID-RECALL-Windows-x64.zip).Hash
          if ($approvedHash -ne 'CB4F2FCB7345782DC6539EAB4923ADF3D9AAA458BE57A3D41DE428C71155C07C') { throw 'Unexpected base preview' }
          Expand-Archive -LiteralPath ACID-RECALL-Windows-x64.zip -DestinationPath tb-menu-preview
          Copy-Item target/release/OpenRB-338.exe tb-menu-preview/ACID-RECALL.exe
          Copy-Item docs/studio.md,docs/midi-controller.md,docs/sampler-drums.md tb-menu-preview/
          Copy-Item docs/studio.md,docs/midi-controller.md,docs/sampler-drums.md tb-menu-preview/docs/
          Copy-Item docs/studio.md tb-menu-preview/README-STUDIO.md
          Copy-Item docs/midi-controller.md tb-menu-preview/README-MIDI.md
          Copy-Item docs/sampler-drums.md tb-menu-preview/README-SAMPLER-DRUMS.md
          Copy-Item docs/tb-note-menu-fix.md tb-menu-preview/README-TB-NOTES-FIX.md
          Compress-Archive -Path tb-menu-preview/* -DestinationPath ACID-RECALL-TB-NOTES-TEST-Windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: TB-note-menu-test
          path: ACID-RECALL-TB-NOTES-TEST-Windows-x64.zip
          if-no-files-found: error
  publish-test:
    name: Publish separate TB note test
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: TB-note-menu-test
      - name: Publish test only
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BUILD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          TAG=windows-tb-notes-test-20261122
          ZIP=ACID-RECALL-TB-NOTES-TEST-Windows-x64.zip
          cat > notes.md <<EOF
          # ACID RECALL — TB note menu correction test

          Right-click a TB step and choose its named note directly in the menu.
          The single-menu selector fixes the previous dropdown closing before selection.
          Pointer-driven tests verify TB-A C to D and TB-B F to A#, with flags retained.

          Extract this ZIP into a separate folder. Test both TBs and save a copy of your project.
          The normal DOWNLOAD / windows-preview release remains unchanged.

          Build source: https://github.com/${GH_REPO}/commit/${BUILD_SHA}
          EOF
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "$ZIP" --clobber
            gh api --method PATCH "repos/${GH_REPO}/git/refs/tags/${TAG}" -f "sha=${BUILD_SHA}" -F force=true > /dev/null
            gh release edit "$TAG" --prerelease --notes-file notes.md
          else
            gh release create "$TAG" "$ZIP" --target "$BUILD_SHA" --prerelease \
              --title 'ACID RECALL — TB note menu test' --notes-file notes.md
          fi
